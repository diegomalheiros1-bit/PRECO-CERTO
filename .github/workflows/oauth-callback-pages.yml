name: Publicar callback OAuth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oauth-callback-pages.yml
      - oauth-callback-site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oauth-callback-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          mkdir -p _site/oauth-callback
          cp oauth-callback-site/index.html _site/oauth-callback/index.html
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
